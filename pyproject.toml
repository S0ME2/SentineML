[project]
name = "sentinelml"
version = "0.1.0"
description = "FastAPI, PostgreSQL and Redis backend for tracking and comparing machine learning experiment metadata."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "redis==8.0.1",
    "sqlalchemy==2.0.51",
    "uvicorn[standard]==0.49.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
