name: Bug report
description: Report a problem with setup, tracking, comparison, or the dashboard.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data and remove credentials from logs and screenshots.
        For vulnerabilities, follow SECURITY.md instead of posting details here.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest example that shows the problem.
      placeholder: |
        1. Start a fresh local stack.
        2. Create a run with ...
        3. Call ... or click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen at the last step?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error text or a redacted screenshot, if useful.
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Docker Compose
        - Native Python / uv
        - Built wheel
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit/version, OS, browser, and relevant Python or Compose version.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, tokens, connection credentials, and private data.
      render: text
